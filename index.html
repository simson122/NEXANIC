<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXANIC — Tudástár</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.55rem; }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
    .status { font-size: 0.84rem; color: var(--muted); margin-bottom: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, label.btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      font-weight: 700;
    }
    input[type="search"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
    }
    .time { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .theme { font-weight: 700; color: var(--accent); font-size: 1.05rem; margin-bottom: 8px; }
    .quote { font-size: 0.93rem; line-height: 1.45; margin: 10px 0; color: #e2e8f0; }
    .subquote { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="title">NEXANIC — Hagyománytár</h1>
        <div class="subtitle" id="subtitle">Kereshető kétnyelvű archívum (HU / EN)</div>
      </div>
      <div class="actions">
        <button id="btn-hu" class="active" onclick="setLang('hu')">HU</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
        <button id="btn-live" class="active" onclick="toggleLive()">Élő: BE</button>
        <button id="btn-refresh" onclick="loadRemote(true)">Frissítés</button>
        <label class="btn" id="btn-local">
          Helyi JSON
          <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadLocalFile(event)" />
        </label>
      </div>
    </header>

    <div id="status" class="status">Adatok betöltése...</div>
    <input id="search" type="search" placeholder="Keresés szokásra, helyszínre, témára vagy szövegre..." oninput="render()" />
    <div id="list" class="grid"></div>
  </div>

  <script>
    const RAW_JSON_URL = "https://raw.githubusercontent.com/simson122/NEXANIC/main/tudastar.json";
    const LIVE_INTERVAL_MS = 4000;

    let records = [];
    let lang = "hu";
    let liveEnabled = true;
    let lastJsonSnapshot = "";
    let isFetching = false;
    const translationCache = new Map();

    const ui = {
      hu: {
        title: "NEXANIC — Hagyománytár",
        subtitle: "Kereshető kétnyelvű archívum (HU / EN)",
        placeholder: "Keresés szokásra, helyszínre, témára vagy szövegre...",
        empty: "Nincs találat.",
        loaded: (n) => `Betöltött bejegyzések: ${n}`,
        liveOn: "Élő: BE",
        liveOff: "Élő: KI",
        refresh: "Frissítés",
        local: "Helyi JSON",
        err: "Nem sikerült betölteni a GitHub JSON-t (használd a 'Helyi JSON' gombot vagy ellenőrizd a repó elérhetőségét)."
      },
      en: {
        title: "NEXANIC — Tradition Archive",
        subtitle: "Searchable bilingual archive (HU / EN)",
        placeholder: "Search traditions, locations, themes or text...",
        empty: "No matching entries.",
        loaded: (n) => `Loaded entries: ${n}`,
        liveOn: "Live: ON",
        liveOff: "Live: OFF",
        refresh: "Refresh",
        local: "Local JSON",
        err: "Failed to load GitHub JSON (use 'Local JSON' or check repository access)."
      }
    };

    function updateStaticUi() {
      document.getElementById("btn-hu").classList.toggle("active", lang === "hu");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      document.getElementById("btn-live").classList.toggle("active", liveEnabled);
      document.getElementById("title").textContent = ui[lang].title;
      document.getElementById("subtitle").textContent = ui[lang].subtitle;
      document.getElementById("search").placeholder = ui[lang].placeholder;
      document.getElementById("btn-live").textContent = liveEnabled ? ui[lang].liveOn : ui[lang].liveOff;
      document.getElementById("btn-refresh").textContent = ui[lang].refresh;
      document.getElementById("btn-local").firstChild.textContent = ui[lang].local + " ";
      if (records.length > 0) {
        document.getElementById("status").textContent = ui[lang].loaded(records.length);
      }
    }

    function setLang(newLang) {
      lang = newLang;
      updateStaticUi();
      render();
    }

    function toggleLive() {
      liveEnabled = !liveEnabled;
      updateStaticUi();
    }

    function getDisplayText(entry, targetLang) {
      const hu = entry.magyar || {};
      const en = entry.english || {};
      const raw = entry.raw || entry.szoveg || entry.text || "";

      if (targetLang === "en") {
        const directEn =
          en.text || en.translation || en.translated_text || en.raw || en.szoveg || en.summary || "";
        if (directEn && String(directEn).trim()) {
          return String(directEn).trim();
        }
        if (!raw) return "";
        const cacheKey = `hu->en:${raw}`;
        if (translationCache.has(cacheKey)) {
          return translationCache.get(cacheKey);
        }
        translateText(raw, "hu", "en").then((translated) => {
          if (translated && translated !== raw) {
            translationCache.set(cacheKey, translated);
            render();
          }
        });
        return raw;
      } else {
        const directHu = hu.text || hu.szoveg || raw || "";
        return String(directHu).trim();
      }
    }

    async function translateText(text, sourceLang, targetLang) {
      try {
        const clipped = String(text).slice(0, 500);
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clipped)}&langpair=${sourceLang}|${targetLang}`;
        const res = await fetch(url);
        if (!res.ok) return text;
        const json = await res.json();
        const out = json?.responseData?.translatedText;
        if (!out || /MYMEMORY WARNING/i.test(out)) return text;
        return out;
      } catch {
        return text;
      }
    }

    async function loadRemote(forceRender = false) {
      if (isFetching) return;
      isFetching = true;
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(`${RAW_JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const textBody = await res.text();
        if (textBody !== lastJsonSnapshot || forceRender) {
          lastJsonSnapshot = textBody;
          const parsed = JSON.parse(textBody);
          records = Array.isArray(parsed) ? parsed : [];
          statusEl.textContent = ui[lang].loaded(records.length);
          render();
        }
      } catch (e) {
        if (!records.length) {
          statusEl.textContent = ui[lang].err;
          render();
        }
      } finally {
        isFetching = false;
      }
    }

    function loadLocalFile(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      liveEnabled = false;
      updateStaticUi();
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          records = Array.isArray(parsed) ? parsed : [];
          document.getElementById("status").textContent = ui[lang].loaded(records.length);
          render();
        } catch (err) {
          alert("Érvénytelen JSON fájl.");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function matches(entry, query) {
      if (!query) return true;
      const hu = entry.magyar || {};
      const en = entry.english || {};
      const hay = [
        entry.raw || "",
        getDisplayText(entry, "en"),
        entry.timestamp || "",
        hu.kultura_tema || "",
        ...(hu.emlitett_szokasok || []),
        ...(hu.emlitett_helyszinek || []),
        en.cultural_theme || "",
        ...(en.mentioned_traditions || []),
        ...(en.mentioned_locations || [])
      ].join(" ").toLowerCase();
      return hay.includes(query.toLowerCase());
    }

    function render() {
      const q = document.getElementById("search").value.trim();
      const list = document.getElementById("list");
      const filtered = records.slice().reverse().filter(item => matches(item, q));

      if (!filtered.length) {
        list.innerHTML = `<div class="empty">${ui[lang].empty}</div>`;
        return;
      }

      list.innerHTML = filtered.map(entry => {
        const hu = entry.magyar || {};
        const en = entry.english || {};
        const theme = lang === "hu"
          ? (hu.kultura_tema || en.cultural_theme || "Hagyomány")
          : (en.cultural_theme || hu.kultura_tema || "Tradition");
        const traditions = lang === "hu"
          ? (hu.emlitett_szokasok || en.mentioned_traditions || [])
          : (en.mentioned_traditions || hu.emlitett_traditions || []);
        const locations = lang === "hu"
          ? (hu.emlitett_helyszinek || en.mentioned_locations || [])
          : (en.mentioned_locations || hu.emlitett_helyszinek || []);

        const tags = [...locations, ...traditions]
          .map(t => `<span class="tag">${escapeHtml(String(t))}</span>`)
          .join("");

        const mainText = getDisplayText(entry, lang);
        const origText = entry.raw || entry.szoveg || "";
        const showOrigHint = lang === "en" && origText && mainText !== origText;

        return `
          <article class="card">
            <div class="time">${escapeHtml(entry.timestamp || "")}</div>
            <div class="theme">${escapeHtml(String(theme))}</div>
            ${mainText ? `<div class="quote">„${escapeHtml(String(mainText))}”</div>` : ""}
            ${showOrigHint ? `<div class="subquote">HU: ${escapeHtml(String(origText))}</div>` : ""}
            <div class="tags">${tags}</div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    updateStaticUi();
    loadRemote(true);
    setInterval(() => {
      if (liveEnabled) loadRemote(false);
    }, LIVE_INTERVAL_MS);
  </script>
</body>
</html>
