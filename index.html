<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXANIC — Tudástár</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 1.55rem; }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }
    .status { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, label.btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      font-weight: 700;
    }
    input[type="search"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
    }
    .time { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .theme { font-weight: 700; color: var(--accent); font-size: 1.05rem; margin-bottom: 8px; }
    .quote { font-size: 0.93rem; line-height: 1.45; margin: 10px 0; color: #e2e8f0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="title">NEXANIC — Hagyománytár</h1>
        <div class="subtitle" id="subtitle">Kereshető kétnyelvű archívum (HU / EN)</div>
      </div>
      <div class="actions">
        <button id="btn-hu" class="active" onclick="setLang('hu')">HU</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
        <button onclick="loadRemote()">Frissítés</button>
        <label class="btn">
          Helyi JSON
          <input type="file" id="file-input" accept=".json" style="display:none" onchange="loadLocalFile(event)" />
        </label>
      </div>
    </header>

    <div id="status" class="status">Adatok betöltése...</div>
    <input id="search" type="search" placeholder="Keresés szokásra, helyszínre, témára vagy szövegre..." oninput="render()" />
    <div id="list" class="grid"></div>
  </div>

  <script>
    const RAW_JSON_URL = "https://raw.githubusercontent.com/simson122/NEXANIC/main/tudastar.json";

    let records = [];
    let lang = "hu";

    const ui = {
      hu: {
        title: "NEXANIC — Hagyománytár",
        subtitle: "Kereshető kétnyelvű archívum (HU / EN)",
        placeholder: "Keresés szokásra, helyszínre, témára vagy szövegre...",
        empty: "Nincs találat.",
        loaded: (n) => `Betöltött bejegyzések: ${n}`,
        err: "Nem sikerült betölteni a GitHub JSON-t (használd a 'Helyi JSON' gombot vagy ellenőrizd a repó elérhetőségét)."
      },
      en: {
        title: "NEXANIC — Tradition Archive",
        subtitle: "Searchable bilingual archive (HU / EN)",
        placeholder: "Search traditions, locations, themes or text...",
        empty: "No matching entries.",
        loaded: (n) => `Loaded entries: ${n}`,
        err: "Failed to load GitHub JSON (use 'Helyi JSON' or check repository access)."
      }
    };

    function setLang(newLang) {
      lang = newLang;
      document.getElementById("btn-hu").classList.toggle("active", lang === "hu");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      document.getElementById("title").textContent = ui[lang].title;
      document.getElementById("subtitle").textContent = ui[lang].subtitle;
      document.getElementById("search").placeholder = ui[lang].placeholder;
      render();
    }

    async function loadRemote() {
      const statusEl = document.getElementById("status");
      try {
        const res = await fetch(`${RAW_JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        records = Array.isArray(data) ? data : [];
        statusEl.textContent = ui[lang].loaded(records.length);
      } catch (e) {
        records = [];
        statusEl.textContent = ui[lang].err;
      }
      render();
    }

    function loadLocalFile(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          records = Array.isArray(parsed) ? parsed : [];
          document.getElementById("status").textContent = ui[lang].loaded(records.length);
          render();
        } catch (err) {
          alert("Érvénytelen JSON fájl.");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    function matches(entry, query) {
      if (!query) return true;
      const hu = entry.magyar || {};
      const en = entry.english || {};
      const hay = [
        entry.raw || "",
        entry.timestamp || "",
        hu.kultura_tema || "",
        ...(hu.emlitett_szokasok || []),
        ...(hu.emlitett_helyszinek || []),
        en.cultural_theme || "",
        ...(en.mentioned_traditions || []),
        ...(en.mentioned_locations || [])
      ].join(" ").toLowerCase();
      return hay.includes(query.toLowerCase());
    }

    function render() {
      const q = document.getElementById("search").value.trim();
      const list = document.getElementById("list");
      const filtered = records.slice().reverse().filter(item => matches(item, q));

      if (!filtered.length) {
        list.innerHTML = `<div class="empty">${ui[lang].empty}</div>`;
        return;
      }

      list.innerHTML = filtered.map(entry => {
        const hu = entry.magyar || {};
        const en = entry.english || {};
        const theme = lang === "hu"
          ? (hu.kultura_tema || en.cultural_theme || "Hagyomány")
          : (en.cultural_theme || hu.kultura_tema || "Tradition");
        const traditions = lang === "hu"
          ? (hu.emlitett_szokasok || en.mentioned_traditions || [])
          : (en.mentioned_traditions || hu.emlitett_szokasok || []);
        const locations = lang === "hu"
          ? (hu.emlitett_helyszinek || en.mentioned_locations || [])
          : (en.mentioned_locations || hu.emlitett_helyszinek || []);

        const tags = [...locations, ...traditions]
          .map(t => `<span class="tag">${escapeHtml(String(t))}</span>`)
          .join("");

        return `
          <article class="card">
            <div class="time">${escapeHtml(entry.timestamp || "")}</div>
            <div class="theme">${escapeHtml(String(theme))}</div>
            ${entry.raw ? `<div class="quote">„${escapeHtml(String(entry.raw))}”</div>` : ""}
            <div class="tags">${tags}</div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    loadRemote();
  </script>
</body>
</html>
